name: hepsiradyo
description: "HepsiRadyo — Türkiye'nin Premium Radyo Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Audio & Background Service
  just_audio: ^0.9.38
  audio_service: ^0.18.15

  # Backend & Local Cache
  supabase_flutter: ^2.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI, Fonts & Animations
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  palette_generator: ^0.3.3+3
  flutter_animate: ^4.5.0
  flutter_spinkit: ^5.2.1

  # Home Widget & Notifications
  home_widget: ^0.6.0
  flutter_local_notifications: ^17.1.2

  # Utilities
  http: ^1.2.1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/default_radios.json
    - assets/images/
